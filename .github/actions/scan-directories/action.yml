name: "Scan Directory"
description: "Run Trivy and Grype on a directory"

inputs:
  version:
    required: true
    description: "Version of the software being scanned"
  path:
    required: true
    description: "Directory to scan"
  prefix:
    required: true
    description: "Prefix for output filenames"

runs:
  using: "composite"
  steps:
    - name: Trivy filesystem scan
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
      with:
        scan-type: fs
        scan-ref: ${{ inputs.path }}
        format: json
        output: ${{ github.workspace }}/${{ inputs.prefix }}-trivy-${{ inputs.version }}.json
        exit-code: 0
        ignore-unfixed: true

    - name: Grype filesystem scan
      uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2
      with:
        path: ${{ inputs.path }}
        output-format: json
        output-file: ${{ github.workspace }}/${{ inputs.prefix }}-grype-${{ inputs.version }}.json
        fail-build: false
        upload-sarif: false

    - name: Verify scan outputs exist
      shell: bash
      run: |
        set -euo pipefail
        ls -la "${{ github.workspace }}"
        test -f "${{ github.workspace }}/${{ inputs.prefix }}-trivy-${{ inputs.version }}.json"
        test -f "${{ github.workspace }}/${{ inputs.prefix }}-grype-${{ inputs.version }}.json"