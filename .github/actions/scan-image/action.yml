name: "Scan Image"
description: "Run Trivy and Grype on a Docker image"

inputs:
  image:
    required: true
    description: "Docker image to scan"
  version:
    required: true
    description: "Version of the software being scanned"

runs:
  using: "composite"
  steps:
    - name: Trivy image scan
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
      with:
        image-ref: ${{ inputs.image }}
        format: json
        output: ${{ github.workspace }}/image-trivy-${{ inputs.version }}.json
        exit-code: 0
        ignore-unfixed: true

    - name: Grype image scan
      continue-on-error: true
      uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2
      with:
        image: docker:${{ inputs.image }}
        output-format: json
        output-file: ${{ github.workspace }}/image-grype-${{ inputs.version }}.json
        fail-build: false

    - name: Verify image scan outputs exist
      shell: bash
      run: |
        for f in \
          "${{ github.workspace }}/image-trivy-${{ inputs.version }}.json" \
          "${{ github.workspace }}/image-grype-${{ inputs.version }}.json"; do
          if [ ! -f "$f" ]; then
            echo "::warning::Image scan did not produce expected file: $f"
          fi
        done